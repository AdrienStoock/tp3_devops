name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, partB, barham ]
  pull_request:
    branches: [ main ]

jobs:
  bandit-sast:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit
        
    - name: Run Bandit security scan with summary
      run: |
        bandit -r . -f txt -o bandit-summary.txt --exit-zero
        bandit -r . -f html -o bandit-report.html --exit-zero
        echo "=== Bandit Scan Summary ==="
        cat bandit-summary.txt
        echo "=== End Bandit Summary ==="
        
    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.html

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: bandit-sast
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/barham'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/adrienstoock/tp3_devops:latest
          ghcr.io/adrienstoock/tp3_devops:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Trigger Coolify deployment via webhook
      if: env.COOLIFY_WEBHOOK_URL != ''
      env:
        COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      run: |
        curl -X POST $COOLIFY_WEBHOOK_URL \
          -H "Content-Type: application/json" \
          -d '{"ref":"${{ github.ref }}", "sha":"${{ github.sha }}"}'