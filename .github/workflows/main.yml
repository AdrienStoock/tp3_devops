name: Build, Scan, and Deploy

on:
  push:
    branches:
      - partB
      - main



jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit  # ✅ assure que Bandit est installé

      - name: Run Bandit security scan with summary
        run: |
         bandit -r . -f json -o bandit-report.json --severity-level medium || true 

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json



  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "Building $IMAGE_NAME"
          docker build -t "$IMAGE_NAME" .

      - name: Push Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker push "$IMAGE_NAME"
        shell: bash
      
      - name: Trigger Coolify webhook
        run: curl -X POST ${{ secrets.COOLIFY_TOKEN }


}
